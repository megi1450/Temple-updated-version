<style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header, footer {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            overflow-x: auto;
            display: block; /* Allows scrolling */
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        button {
            background-color: #5cb85c;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #4cae4c;
        }

        /* Responsive Styles */
        @media (max-width: 600px) {
            th, td {
                font-size: 14px;
                padding: 8px;
            }

            button {
                width: 100%;
                padding: 10px;
            }

            /* Table layout adjustments for mobile */
            table {
                display: block;
                overflow-x: auto;
                white-space: nowrap; /* Prevent wrapping */
            }

            tr {
                display: flex;
                flex-direction: column; /* Stack rows vertically */
                margin-bottom: 10px;
                background: #fff; /* Card background */
                border-radius: 8px; /* Rounded corners */
                padding: 15px; /* Inner spacing */
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); /* Subtle shadow */
                position: relative; /* For positioning the expand button */
            }

            th {
                display: none; /* Hide header on small screens */
            }

            td {
                display: flex;
                justify-content: space-between; /* Space between labels and values */
                padding: 5px; /* Adjust padding */
                border: none; /* Remove borders */
                font-size: 16px; /* Adjust font size */
                margin-bottom: 5px; /* Space between each item */
            }

            .label {
                font-weight: bold; /* Highlight labels */
                color: #333; /* Label color */
            }

            .value {
                text-align: right; /* Align values to the right */
                color: #555; /* Value color */
            }

            .toggle-button {
                background: none;
                border: none;
                cursor: pointer;
                font-size: 20px; /* Increase size for visibility */
                color: #5cb85c; /* Match with the theme color */
                margin-top: 10px; /* Space above button */
            }

            .expandable-content {
                display: none; /* Hidden by default */
                padding-top: 10px; /* Spacing above the expandable content */
                border-top: 1px solid #ccc; /* Divider for the expandable content */
                margin-top: 10px; /* Space above expandable content */
            }

            .expanded {
                display: block; /* Show content when expanded */
            }
        }
/* Responsive Styles for Larger Screens */
@media (min-width: 601px) {
    table {
        display: table; /* Standard table layout */
        overflow-x: visible;
        white-space: normal;
    }

    tr {
        display: table-row;
        margin-bottom: 0;

<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/9.12.0/firebase-app.js';
import {getAuth,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/9.12.0/firebase-auth.js';
import {getFirestore,collection,getDocs} from 'https://www.gstatic.com/firebasejs/9.12.0/firebase-firestore.js';
const config=window.TEMPLE_FIREBASE_CONFIG;
async function fetchRegistrationHistory(){
 const body=document.querySelector('#registrationTable tbody');if(!body)return;body.replaceChildren();
 if(!config||config.projectId==='YOUR_STAGING_PROJECT_ID'){const row=document.createElement('tr'),cell=document.createElement('td');cell.colSpan=6;cell.textContent='Staging Firebase is not configured.';row.append(cell);body.append(row);return;}
 try{const app=initializeApp(config),auth=getAuth(app);
 const user=await new Promise(resolve=>{const unsub=onAuthStateChanged(auth,value=>{unsub();resolve(value);});});if(!user||!user.emailVerified){location.replace('resident-access.html');return;}const token=await user.getIdTokenResult(true),flat=token.claims.flatNumber;if(token.claims.role!=='resident'||!flat){location.replace('resident-access.html');return;}const db=getFirestore(app),snapshot=await getDocs(collection(db,'users',flat,'registrations')),large=window.innerWidth>=601;
 snapshot.docs.sort((a,b)=>String(b.data().date||'').localeCompare(String(a.data().date||''))).forEach(item=>{const data=item.data(),row=document.createElement('tr');
 const addCell=(parent,value)=>{const td=document.createElement('td');td.textContent=String(value??'');parent.append(td);};
 if(large){[data.name,data.date,data.mobileNumber,data.event,data.occasion,data.receiptNumber].forEach(v=>addCell(row,v));}
 else{addCell(row,data.event);addCell(row,data.receiptNumber);const control=document.createElement('td'),toggle=document.createElement('button');toggle.type='button';toggle.className='toggle-button';toggle.textContent='+';toggle.setAttribute('aria-expanded','false');control.append(toggle);row.append(control);const details=document.createElement('td'),panel=document.createElement('div');panel.className='expandable-content';[['Name',data.name],['Date',data.date],['Mobile Number',data.mobileNumber],['Event',data.event],['Occasion',data.occasion],['Receipt No',data.receiptNumber]].forEach(([label,value])=>{const line=document.createElement('div'),strong=document.createElement('span'),text=document.createElement('span');strong.className='label';strong.textContent=label+': ';text.className='value';text.textContent=String(value??'');line.append(strong,text);panel.append(line);});details.append(panel);row.append(details);toggle.addEventListener('click',e=>{e.stopPropagation();const open=panel.classList.toggle('expanded');toggle.textContent=open?'−':'+';toggle.setAttribute('aria-expanded',String(open));});}
 body.append(row);});
 }catch(error){console.error('Registration history could not be loaded:',error);const row=document.createElement('tr'),cell=document.createElement('td');cell.colSpan=6;cell.textContent='Registration history could not be loaded. Please sign in again or refresh.';row.append(cell);body.append(row);}
}
fetchRegistrationHistory();window.addEventListener('resize',()=>{clearTimeout(window.__templeHistoryResize);window.__templeHistoryResize=setTimeout(fetchRegistrationHistory,150);});
</script>
