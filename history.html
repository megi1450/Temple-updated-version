<style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header, footer {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            overflow-x: auto;
            display: block; /* Allows scrolling */
        }

        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        button {
            background-color: #5cb85c;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #4cae4c;
        }

        /* Responsive Styles */
        @media (max-width: 600px) {
            th, td {
                font-size: 14px;
                padding: 8px;
            }

            button {
                width: 100%;
                padding: 10px;
            }

            /* Table layout adjustments for mobile */
            table {
                display: block;
                overflow-x: auto;
                white-space: nowrap; /* Prevent wrapping */
            }

            tr {
                display: flex;
                flex-direction: column; /* Stack rows vertically */
                margin-bottom: 10px;
                background: #fff; /* Card background */
                border-radius: 8px; /* Rounded corners */
                padding: 15px; /* Inner spacing */
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); /* Subtle shadow */
                position: relative; /* For positioning the expand button */
            }

            th {
                display: none; /* Hide header on small screens */
            }

            td {
                display: flex;
                justify-content: space-between; /* Space between labels and values */
                padding: 5px; /* Adjust padding */
                border: none; /* Remove borders */
                font-size: 16px; /* Adjust font size */
                margin-bottom: 5px; /* Space between each item */
            }

            .label {
                font-weight: bold; /* Highlight labels */
                color: #333; /* Label color */
            }

            .value {
                text-align: right; /* Align values to the right */
                color: #555; /* Value color */
            }

            .toggle-button {
                background: none;
                border: none;
                cursor: pointer;
                font-size: 20px; /* Increase size for visibility */
                color: #5cb85c; /* Match with the theme color */
                margin-top: 10px; /* Space above button */
            }

            .expandable-content {
                display: none; /* Hidden by default */
                padding-top: 10px; /* Spacing above the expandable content */
                border-top: 1px solid #ccc; /* Divider for the expandable content */
                margin-top: 10px; /* Space above expandable content */
            }

            .expanded {
                display: block; /* Show content when expanded */
            }
        }
/* Responsive Styles for Larger Screens */
@media (min-width: 601px) {
    table {
        display: table; /* Standard table layout */
        overflow-x: visible;
        white-space: normal;
    }

    tr {
        display: table-row;
        margin-bottom: 0;
        background: none;
        border-radius: 0;
        padding: 0;
        box-shadow: none;
    }

    td, th {
        display: table-cell;
        padding: 10px;
        border: 1px solid #ccc;
        font-size: 16px;
    }

    th {
        background-color: #f2f2f2;
        font-weight: bold;
    }

    /* Hide the toggle button and expandable content for larger screens */
    .toggle-button, .expandable-content {
        display: none;
    }
}

    </style>
<link href="redesign.css" rel="stylesheet"/></head>
<body data-area="resident" data-page="history.html" onload="checksignin()">
<div class="hamburger2">
<img class="hlogo" src="assets/branding/logos/logo3.avif" alt="Shri Varasiddhi Vinayaka Temple logo"/>  <p>Shri Varasiddhi Vinayaka Temple</p>
</div>
<div style="width: 100%; align-items: center; justify-items: center;">
<div style="width: 100%; align-items: center; justify-items: center;">
<div class="hamburger" onclick="home()">🏠︎ Go to Home</div>
</div>
</div>
<main class="container">
<h2>Registration History</h2>
<table id="registrationTable">
<thead>
<tr>
<th>Name</th>
<th>Date</th>
<th>Mobile Number</th>
<th>Event</th>
<th>Occasion</th>
<th>Receipt No.</th>
</tr>
</thead>
<tbody>
<!-- Dynamic rows will be inserted here -->
</tbody>
</table>
</main>
<footer class="main-footer2">
<div class="container" style="width: 100%; align-items: center; justify-content: center;">
<p>© 2024 Shri Varasiddhi Vinayaka Arvind Oasis Temple Committee | All Rights Reserved</p>
<hr/>
</div>
</footer>
<script src="firebase-config.js"></script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/9.12.0/firebase-app.js';
import {getFirestore,collection,getDocs} from 'https://www.gstatic.com/firebasejs/9.12.0/firebase-firestore.js';
const c=window.TEMPLE_FIREBASE_CONFIG;
async function loadHistory(){const body=document.querySelector('#registrationTable tbody');if(!body)return;body.replaceChildren();const flat=localStorage.getItem('flatNumber'),name=localStorage.getItem('residentName'),email=localStorage.getItem('email');if(localStorage.getItem('input')!=='true'||!flat||!name||!email){location.replace('login.html');return;}try{const db=getFirestore(initializeApp(c)),snap=await getDocs(collection(db,'users',flat,'registrations'));const rows=snap.docs.map(d=>d.data()).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));for(const d of rows){const tr=document.createElement('tr');[d.name,d.date,d.mobileNumber,d.event,d.occasion,d.receiptNumber].forEach(v=>{const td=document.createElement('td');td.textContent=String(v??'');tr.append(td);});body.append(tr);}if(!rows.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=6;td.textContent='No registrations found.';tr.append(td);body.append(tr);}}catch(e){console.error(e);const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=6;td.textContent='Could not load registration history. Please refresh.';tr.append(td);body.append(tr);}}
loadHistory();
</script>

<script src="site-shell.js"></script>
<script src="script.js"></script>
