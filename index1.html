<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resident registration | Shri Varasiddhi Vinayaka Temple</title>
  <link rel="icon" href="assets/branding/logos/logo.png">
  <link rel="stylesheet" href="redesign.css">
</head>
<body class="auth-page" data-page="index1.html" data-auth-mode="register">
  <main class="container" aria-labelledby="access-title">
    <div class="greeting">
      <h2 id="access-title" data-en="Resident registration" data-kn="ನಿವಾಸಿ ನೋಂದಣಿ">Resident registration</h2>
      <p data-en="Register once to use temple resident services." data-kn="ದೇವಾಲಯದ ನಿವಾಸಿ ಸೇವೆಗಳನ್ನು ಬಳಸಲು ಒಮ್ಮೆ ನೋಂದಾಯಿಸಿ.">Register once to use temple resident services.</p>
    </div>
    <form id="residentAccessForm" class="auth-form" novalidate>
      <div class="auth-field">
        <label for="flatNumber" data-en="Flat number" data-kn="ಫ್ಲಾಟ್ ಸಂಖ್ಯೆ">Flat number</label>
        <input id="flatNumber" name="flatNumber" maxlength="5" pattern="^([A-F])?(00[1-4]|0?[1-9]0[1-4]|1[0-9]0[1-4])$" placeholder="Flat number (e.g., A001)" data-en-placeholder="Flat number (e.g., A001)" data-kn-placeholder="ಫ್ಲಾಟ್ ಸಂಖ್ಯೆ (ಉದಾ., A001)" title="Valid flat: 001–004 or 101–1904, optionally prefixed A–F" required autocomplete="off">
      </div>
      <div class="auth-field">
        <label for="residentName" data-en="Your name" data-kn="ನಿಮ್ಮ ಹೆಸರು">Your name</label>
        <input id="residentName" name="residentName" type="text" placeholder="Your name" data-en-placeholder="Your name" data-kn-placeholder="ನಿಮ್ಮ ಹೆಸರು" required autocomplete="name">
      </div>
      <div class="auth-field">
        <label for="email" data-en="Email address" data-kn="ಇಮೇಲ್ ವಿಳಾಸ">Email address</label>
        <input id="email" name="email" type="email" placeholder="Email address" data-en-placeholder="Email address" data-kn-placeholder="ಇಮೇಲ್ ವಿಳಾಸ" required autocomplete="email">
      </div>
      <p class="auth-help" data-en="Use details that can identify your resident record." data-kn="ನಿಮ್ಮ ನಿವಾಸಿ ದಾಖಲೆಯನ್ನು ಗುರುತಿಸಬಹುದಾದ ವಿವರಗಳನ್ನು ಬಳಸಿ.">Use details that can identify your resident record.</p>
      <p id="authStatus" class="auth-status" role="alert" aria-live="polite"></p>
      <button class="auth-submit" type="submit" data-en="Register" data-kn="ನೋಂದಣಿ">Register</button>
    </form>
  </main>
  <script src="site-shell.js"></script>
  <script type="module" src="auth.js"></script>
</body>
</html>
