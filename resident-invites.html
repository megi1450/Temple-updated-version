<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5b2630"><title>Resident Invitations | Shri Varasiddhi Vinayaka Temple</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="redesign.css"><link rel="stylesheet" href="site-polish.css"></head>
<body data-page="resident-invites.html" class="admin-page">
<main class="site-content"><section class="page-hero"><p class="eyebrow">Restricted administration</p><h1>Resident invitations</h1><p>Create a one-time invitation for a specific flat, resident name and email address.</p></section>
<section class="content-card" style="max-width:760px;margin:2rem auto;padding:clamp(1.25rem,3vw,2rem)"><form id="inviteForm" class="auth-form"><div class="auth-field"><label for="flatNumber">Flat number</label><input id="flatNumber" name="flatNumber" maxlength="5" placeholder="A1404" required autocapitalize="characters"></div><div class="auth-field"><label for="residentName">Resident full name</label><input id="residentName" name="residentName" required autocomplete="name"></div><div class="auth-field"><label for="email">Resident email</label><input id="email" name="email" type="email" required autocomplete="email"></div><button class="auth-submit" type="submit">Generate one-time invitation</button></form><p id="inviteStatus" role="status" aria-live="polite"></p><section id="inviteResult" hidden><h2>Invitation code</h2><p>Share this code securely with the intended resident. It is shown only once.</p><code id="inviteCode" style="display:block;overflow-wrap:anywhere;padding:1rem;background:#f6f1e9;border-radius:12px"></code><button id="copyInvite" type="button" class="btn">Copy invitation code</button></section></section></main>
<script src="firebase-config.js"></script><script src="site-shell.js"></script><script type="module" src="admin-guard.js"></script><script type="module" src="resident-invites.js"></script></body></html>
