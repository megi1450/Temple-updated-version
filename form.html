<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#632b35">
  <title>Puja Registration | Shri Varasiddhi Vinayaka Temple</title>
  <link rel="icon" href="assets/branding/logos/logo.png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="redesign.css">
</head>
<body data-area="resident" data-page="form.html" onload="checksignin()">
  <main class="site-content registration-page">
    <form id="registrationForm" class="portal-form" aria-labelledby="registrationTitle">
      <div class="portal-form__heading">
        <span class="section-kicker">RESIDENT SERVICES</span>
        <h1 id="registrationTitle">Register for a Puja or Seva</h1>
        <p>Choose your preferred date and service. Your receipt details will be shown after successful submission.</p>
      </div>
      <div class="form-field"><label for="name">Full name</label><input id="name" name="name" placeholder="Full name" required type="text" autocomplete="name"></div>
      <div class="form-field"><label for="date">Preferred date</label><input id="date" name="date" required type="date"></div>
      <div class="form-field"><label for="mobileNumber">Mobile number</label><input id="mobileNumber" name="mobileNumber" placeholder="10-digit mobile number" required type="tel" inputmode="numeric" maxlength="10" pattern="[6-9][0-9]{9}" autocomplete="tel"></div>
      <div class="form-field"><label for="event">Puja or seva</label><select id="event" name="event" required>
        <option disabled selected value="">Select puja / seva</option>
        <option value="PANCHAMRIT ABHISHEKA">PANCHAMRIT ABHISHEKA</option>
        <option value="NIRANTARA ABHISHEKA">NIRANTARA ABHISHEKA</option>
        <option value="SANKASHTAHARA CHATURTHI">SANKASHTAHARA CHATURTHI</option>
        <option value="SHRI SATYANARAYANA PUJA GROUP CEREMONY">SHRI SATYANARAYANA PUJA GROUP CEREMONY</option>
        <option value="VEHICLE PUJA (TWO-WHEELER)">VEHICLE PUJA (TWO-WHEELER)</option>
        <option value="VEHICLE PUJA (FOUR-WHEELER)">VEHICLE PUJA (FOUR-WHEELER)</option>
      </select></div>
      <div class="form-field"><label for="occasion">Occasion</label><select id="occasion" name="occasion" required>
        <option disabled selected value="">Select occasion</option>
        <option value="Birthday">Birthday</option>
        <option value="Anniversary">Anniversary</option>
        <option value="Others">Others</option>
      </select></div>
      <label for="otherOccasion">Specify other occasion</label>
      <input id="otherOccasion" name="otherOccasion" placeholder="If Others, please specify" style="display:none" type="text">
      <button class="portal-submit" type="submit">Continue to confirmation</button>
      <p class="portal-form__note">Please check your details before submitting. If you need assistance, contact the temple committee.</p>
    </form>
  </main>
  <script src="script.js"></script>
  <script src="firebase-config.js"></script>
  <script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.12.0/firebase-app.js';
import { getFirestore, doc, runTransaction, serverTimestamp } from 'https://www.gstatic.com/firebasejs/9.12.0/firebase-firestore.js';
const app=initializeApp(window.TEMPLE_FIREBASE_CONFIG),db=getFirestore(app),flatNumber=localStorage.getItem('flatNumber');
const form=document.getElementById('registrationForm'),occasionSelect=document.getElementById('occasion'),otherInput=document.getElementById('otherOccasion');
occasionSelect?.addEventListener('change',()=>{const other=occasionSelect.value==='Others';otherInput.style.display=other?'block':'none';otherInput.required=other;});
form?.addEventListener('submit',async event=>{event.preventDefault();if(!form.reportValidity())return;if(localStorage.getItem('input')!=='true'||!flatNumber){location.replace('login.html');return;}
 const name=document.getElementById('name').value.trim(),date=document.getElementById('date').value,mobileNumber=document.getElementById('mobileNumber').value.trim(),eventName=document.getElementById('event').value,occasion=occasionSelect.value,otherOccasion=otherInput.value.trim(),finalOccasion=occasion==='Others'?otherOccasion:occasion;
 if(!name||!date||!/^[6-9]\d{9}$/.test(mobileNumber)||!eventName||!finalOccasion){alert('Please check all registration details.');return;}
 const registrationId=`${flatNumber}_${name}_${eventName}_${finalOccasion}`,submissionRef=doc(db,'submissions',registrationId),residentRef=doc(db,'users',flatNumber,'registrations',registrationId),counterRef=doc(db,'receiptNumbers','counter'),button=form.querySelector('[type=submit]');button.disabled=true;button.textContent='Submitting…';
 try{const result=await runTransaction(db,async tx=>{const duplicate=await tx.get(submissionRef);const counter=await tx.get(counterRef);if(duplicate.exists())throw new Error('DUPLICATE_REGISTRATION');const last=counter.exists()?String(counter.data().lastReceiptNumber||'0000'):'0000';const receiptNumber=String(parseInt(last,10)+1).padStart(4,'0');const data={name,date,flatNumber,mobileNumber,event:eventName,occasion:finalOccasion,registrationId,createdAt:serverTimestamp(),receiptNumber};tx.set(submissionRef,data);tx.set(residentRef,data);tx.set(counterRef,{lastReceiptNumber:receiptNumber});return data;});const params=new URLSearchParams({receiptNumber:result.receiptNumber,name:result.name,date:result.date,flatNumber:result.flatNumber,mobileNumber:result.mobileNumber,event:result.event,occasion:result.occasion,registrationId:result.registrationId});location.href='receipt.html?'+params.toString();}
 catch(error){console.error('Puja registration failed:',error);alert(error.message==='DUPLICATE_REGISTRATION'?'This registration already exists. Please check your registration history.':'The registration could not be saved. Please try again.');button.disabled=false;button.textContent='Submit';}
});
</script>
  <script src="site-shell.js"></script>
</body>
</html>
